version: '3.8'

# Production Application Stack (Stateless components)
# Deploy this on your App Server

services:
  # ───────────────────── Observability ──────────────────────
  # All four services are behind the "observability" profile (opt-in):
  #   docker-compose -f docker-compose.prod-no-db.yml --profile observability up -d
  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: ["observability"]
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    # labels:
    #   - "caddy_0.basicauth.${JAEGER_AUTH_USER}=${JAEGER_AUTH_HASH}"
    expose:
      - "16686"
      - "4317"
      - "4318"
    networks:
      - internal

  loki:
    image: grafana/loki:latest
    container_name: diavgeia_loki
    profiles: ["observability"]
    restart: always
    expose:
      - "3100"
    networks:
      - internal
    volumes:
      - loki_data:/loki
      - ./docker/loki-config:/etc/loki
    command: -config.file=/etc/loki/local-config.yaml
    user: "0:0"  # run as root — volume is owned by root, otherwise mkdir fails
    healthcheck:
      # grafana/loki:latest is distroless (no shell, no wget).
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:latest
    container_name: diavgeia_promtail
    profiles: ["observability"]
    restart: always
    volumes:
      - ./docker/promtail-config/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    environment:
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks:
      - internal
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: diavgeia_grafana
    profiles: ["observability"]
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    expose:
      - "3000"
    networks:
      - internal
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

  # ───────────────────────── Broker ──────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: diavgeia_rabbitmq
    restart: always
    expose:
      - "5672"
      - "15672"
      - "15692"   # rabbitmq_prometheus (queue depth / consumers)
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    networks:
      - internal
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # Mount the directory, never the individual files.  Docker creates a
      # missing bind-mount source as a DIRECTORY; mounting `rabbitmq.conf` or
      # `enabled_plugins` directly makes the deploy fail when the artifact
      # later tries to copy those paths as files.
      - ./docker/rabbitmq-config:/etc/rabbitmq:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5

  # ──────────────────────── Cache ─────────────────────────
  redis:
    image: redis:8.0.0-alpine
    container_name: diavgeia_redis
    restart: always
    command: sh -c "redis-server $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping"]
      interval: 30s
      timeout: 3s
      retries: 5

  # ──────────────────── Connection Pooler ────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: diavgeia_pgbouncer
    restart: always
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=25
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=3
      - SERVER_IDLE_TIMEOUT=600
      - MAX_DB_CONNECTIONS=0
      - MAX_USER_CONNECTIONS=0
      - AUTH_TYPE=scram-sha-256
      - CLIENT_TLS_SSLMODE=disable
    expose:
      - "5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────── Backend ─────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: diavgeia_backend
    restart: always
    volumes:
      # Optional: Bind mounts for hot-fixing production without rebuild (use with caution)
      # In true immutable prod, remove these bind mounts.
      - ./backend/api:/code/api
      - ./backend/core:/code/core
      - ./backend/diavgeia_project:/code/diavgeia_project
      - ./backend/docs:/code/docs
      - ./backend/sql_queries:/code/sql_queries
      - ./backend/templates:/code/templates
      - ./backend/users:/code/users
      - ./backend/version:/code/version
      - ./backend/manage.py:/code/manage.py
      - ./backend/pyproject.toml:/code/pyproject.toml
      - ./backend/poetry.lock:/code/poetry.lock
      - ./backend/Makefile:/code/Makefile
    expose:
      - "8000"
    environment:
      # VITAL: Points to remote servers via PgBouncer for connection pooling
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      - OPENSEARCH_URL=${OPENSEARCH_URL} # e.g., http://my-os-server.com:9200
      - INDEX_THE_OPENSEARCH=${INDEX_THE_OPENSEARCH:-true}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - JAEGER_HOST=${JAEGER_HOST:-jaeger}
      - JAEGER_PORT=${JAEGER_PORT:-4317}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DEBUG=${DEBUG:-false}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      # Canonical first, then legacy: https://crati.co,https://preview-test.crati.co
      # Feeds ALLOWED_HOSTS (via FRONTEND_HOSTNAMES), CORS/CSRF/CSP, and the
      # canonical base URL used in notification emails (frontend_base_url()).
      - FRONTEND_DOMAINS=${FRONTEND_DOMAINS}
      - GEMI_API_KEY=${GEMI_API_KEY}
      - STEALTH_MODE=${STEALTH_MODE:-false}
      - STEALTH_ALLOWLIST=${STEALTH_ALLOWLIST:-false}
      # Clerk: backend owns all three Clerk values; the frontend receives the
      # publishable key at runtime via /api/system/config/auth/
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-crati-backups}
    networks:
      # Alias exists ONLY on the internal network. Nginx proxies to
      # 'backend-internal', a name that can never resolve on the shared
      # 'coolify' network — making cross-env round-robin impossible even
      # if another stack mistakenly attaches its own 'backend' to coolify.
      internal:
        aliases:
          - backend-internal
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        LIGHT_WORKER: ${LIGHT_WORKER:-false}
    container_name: diavgeia_worker
    restart: always
    # A deploy must never hang waiting for an immortal OCR child.
    stop_grace_period: 30s
    # Backstop: a runaway can degrade but cannot take the host.
    cpus: "3.0"
    mem_limit: 4g
    command:  ["/bin/sh", "-c", "chmod +x /code/worker_entrypoint.sh && /code/worker_entrypoint.sh"]
    networks:
      - internal
    depends_on:
      rabbitmq:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      # Same vital remote connections via PgBouncer
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      - OPENSEARCH_URL=${OPENSEARCH_URL}
      - INDEX_THE_OPENSEARCH=${INDEX_THE_OPENSEARCH:-true}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - JAEGER_HOST=${JAEGER_HOST:-jaeger}
      - JAEGER_PORT=${JAEGER_PORT:-4317}
      - GEMI_API_KEY=${GEMI_API_KEY}
      # Needed so worker-generated notification emails link to the canonical host.
      - FRONTEND_DOMAINS=${FRONTEND_DOMAINS}
      - LIGHT_WORKER=${LIGHT_WORKER:-false}
      # One core per Tesseract process; global OCR concurrency is capped in code.
      - OMP_THREAD_LIMIT=1
      - OCR_MAX_CONCURRENT=${OCR_MAX_CONCURRENT:-2}
      - OCR_SLOT_TTL_SECONDS=${OCR_SLOT_TTL_SECONDS:-1800}
      - OCR_PAGE_TIMEOUT_SECONDS=${OCR_PAGE_TIMEOUT_SECONDS:-60}
      - OCR_MAX_SECONDS_PER_DOCUMENT=${OCR_MAX_SECONDS_PER_DOCUMENT:-300}
      - OCR_MAX_PAGES=${OCR_MAX_PAGES:-20}
      - OCR_MAX_PIXELS=${OCR_MAX_PIXELS:-12000000}
      - OCR_MAX_NATIVE_CHARS=${OCR_MAX_NATIVE_CHARS:-50000}
      - OCR_COMPUTE_CONFIDENCE=${OCR_COMPUTE_CONFIDENCE:-false}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-crati-backups}
    # `restart: always` does NOT restart an unhealthy container.  The ping
    # fails exactly when the consumer is dead (the 2026-11-10 failure mode);
    # autoheal below watches the label.
    healthcheck:
      test: ["CMD-SHELL", "celery -A diavgeia_project inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      autoheal: "true"
  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.celery-light
    container_name: diavgeia_beat
    restart: always
    command: celery -A diavgeia_project beat -l INFO
    networks:
      - internal
    depends_on:
      rabbitmq:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - GEMI_API_KEY=${GEMI_API_KEY}
      # Needed so beat-scheduled notification emails link to the canonical host.
      - FRONTEND_DOMAINS=${FRONTEND_DOMAINS}

  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.celery-light
    container_name: diavgeia_flower
    restart: always
    command: celery -A diavgeia_project flower --port=5555 --basic-auth=${FLOWER_BASIC_AUTH}
    networks:
      - internal
    expose:
      - "5555"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH}

  # ─────────────────── Autoheal (unhealthy) ──────────────────
  # `restart: always` never restarts an unhealthy container.  autoheal
  # restarts containers labelled `autoheal=true` when their healthcheck fails
  # (i.e. when the Celery consumer is dead but the process is still Up).
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: diavgeia_autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

  # ───────────────────────── Front end ───────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend.prod
      args:
        # No REACT_APP_CLERK_PUBLISHABLE_KEY: the backend advertises auth
        # methods + the publishable key at runtime via /api/system/config/auth/
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    networks:
      # Internal-only alias, same reasoning as backend-internal above.
      internal:
        aliases:
          - frontend-internal

  # ──────────────────────── Gateway ──────────────────────────
  # This is the APP Gateway for HTTP traffic
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    volumes:
      # Mounted as an envsubst template: the nginx entrypoint renders
      # ${CANONICAL_DOMAIN} / ${LEGACY_REDIRECT_FROM} into conf.d/default.conf.
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    expose:
      - "80"
    # NOTE: jaeger is intentionally NOT a dependency — it's behind the
    # "observability" profile and nginx doesn't proxy to it, so the
    # minimal stack must boot without it.
    depends_on: [backend, frontend, flower]
    environment:
    - HOST=0.0.0.0
    - STAGING_MODE=${STAGING_MODE:-false}
    - STAGING_USERNAME=${STAGING_USERNAME:-}
    - STAGING_PASSWORD=${STAGING_PASSWORD:-}
    # Canonical host + optional legacy host(s) that 301-redirect to it
    # (space-separated list works). LEGACY_REDIRECT_FROM defaults to a
    # non-matching placeholder, so deployments without a legacy domain
    # can simply omit it — the redirect block becomes a harmless no-op.
    - CANONICAL_DOMAIN=${CANONICAL_DOMAIN:-crati.co}
    - LEGACY_REDIRECT_FROM=${LEGACY_REDIRECT_FROM:-_.invalid}
    networks:
      - internal   # reach backend/frontend/flower upstreams
      - coolify    # only proxy-facing service on the shared network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    profiles: ["observability","resource-monitoring"]
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    networks:
      - internal

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability", "resource-monitoring"]
    restart: always
    volumes:
      - ./docker/prometheus-config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - internal

volumes:
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  # Internal service-to-service traffic. Compose names this
  # <project>_internal, so each environment gets its own DNS scope —
  # 'pgbouncer', 'redis', etc. can never resolve across environments.
  internal:
    driver: bridge
  # Shared Coolify proxy network. ONLY nginx (and any other service that
  # must receive proxied domain traffic, e.g. grafana) may attach here.
  # Attaching internal services here makes their names ambiguous in the
  # shared DNS — see docs/postmortems/2026-08-28-pgbouncer-sasl-cross-env-dns-collision.md
  coolify:
    external: true
    name: coolify
