name: 'Check i18n translations'
description: >-
  Verify that translation keys referenced in the frontend source exist in every
  locale, and that the locale files stay in sync. Node-only: no npm install is
  required. The calling job must check out the repository first.
inputs:
  fail-on-unused:
    description: 'Also fail when a locale JSON defines keys that no source file references'
    required: false
    default: 'false'
  working-directory:
    description: 'Directory containing scripts/check-i18n.js'
    required: false
    default: 'frontend'
runs:
  using: 'composite'
  steps:
    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Check translation coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "${{ inputs.fail-on-unused }}" = "true" ]; then
          node scripts/check-i18n.js --fail-on-unused
        else
          node scripts/check-i18n.js
        fi
