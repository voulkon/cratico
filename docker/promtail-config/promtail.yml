server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker socket scraping - RUNNING containers only
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: status
            values: [running]

    relabel_configs:
      # Capture container name (e.g., diavgeia_worker, diavgeia_backend).
      # NOTE: promtail runs with -config.expand-env=true, so regex capture
      # groups MUST be written as `$${1}`; a plain `${1}` is treated as an
      # environment variable named "1" and expands to an empty string.
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container_name'
        regex: '/(.*)'
        replacement: '$${1}'

      # Map to standardized service_name (hyphenated, matching SERVICE_NAME env var)
      - source_labels: ['__meta_docker_container_name']
        target_label: 'service_name'
        regex: '/diavgeia_backend'
        replacement: 'diavgeia-backend'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'service_name'
        regex: '/diavgeia_worker'
        replacement: 'diavgeia-worker'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'service_name'
        regex: '/diavgeia_beat'
        replacement: 'diavgeia-beat'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'service_name'
        regex: '/diavgeia_(.*)'
        replacement: 'diavgeia-$${1}'
      # Coolify names containers `<role>-<uuid>`; map both schemes so
      # service_name is not empty in production.  Keep the `diavgeia-<role>`
      # form because the provisioned dashboards filter on it.
      - source_labels: ['__meta_docker_container_name']
        target_label: 'service_name'
        regex: '/(backend|worker|beat|flower|rabbitmq|redis|pgbouncer|db|postgres|nginx|grafana|prometheus|loki|promtail|autoheal)(-.*)?'
        replacement: 'diavgeia-$${1}'

      # Set component type for easier filtering
      - source_labels: ['__meta_docker_container_name']
        target_label: 'component'
        regex: '/diavgeia_backend'
        replacement: 'django'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'component'
        regex: '/diavgeia_worker'
        replacement: 'celery'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'component'
        regex: '/diavgeia_beat'
        replacement: 'celery-beat'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'component'
        regex: '/diavgeia_db'
        replacement: 'database'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'component'
        regex: '/diavgeia_redis'
        replacement: 'cache'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'component'
        regex: '/diavgeia_nginx'
        replacement: 'webserver'

      # Coolify `<role>-<uuid>` names: mirror the component mapping above so
      # the `diavgeia-logs` dashboard (`component=~"django|celery|..."`) keeps
      # working in production.
      - source_labels: ['__meta_docker_container_name']
        target_label: 'component'
        regex: '/backend(-.*)?'
        replacement: 'django'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'component'
        regex: '/worker(-.*)?'
        replacement: 'celery'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'component'
        regex: '/beat(-.*)?'
        replacement: 'celery-beat'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'component'
        regex: '/redis(-.*)?'
        replacement: 'cache'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'component'
        regex: '/(db|postgres)(-.*)?'
        replacement: 'database'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'component'
        regex: '/(nginx|frontend)(-.*)?'
        replacement: 'webserver'

      # Keep this label value stable: the provisioned dashboards filter on
      # `environment="development"`.  Do not switch this to DEPLOY_ENV without
      # also parameterising the dashboards.
      - target_label: 'environment'
        replacement: 'development'

    pipeline_stages:
      - docker: {}

      # Parse JSON log lines emitted by both loguru and pythonjsonlogger.
      # Both use the same field names: level, logger, message, function, file, line.
      # The original JSON line is preserved so Grafana's Explore view can still
      # auto-detect and offer structured filtering.
      - json:
          expressions:
            level:    level
            logger:   logger
            message:  message
            function: function
            file:     file
            line:     line

      # Promote low-cardinality fields to Loki stream labels for fast
      # exact-match filtering: {level="ERROR"}, {logger="core.tasks.health_check_tasks"}
      - labels:
          level: ""
          logger: ""
