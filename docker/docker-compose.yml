name: diavgeia

# Usage:
# docker-compose -f docker/docker-compose.yml --env-file=.env_files/.env.local.secrets up
# docker-compose -f docker/docker-compose.yml --env-file=.env_files/.env.local.secrets down

services:

  # ───────────────────── Observability ──────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true         # enable modern OTLP receiver
    # expose *one* port for the UI only
    ports:
      - "16686:16686"                       # http://<host>/jaeger (proxied)
      - "4317:4317"                         # OTLP gRPC port
      - "4318:4318"                         # OTLP HTTP port
    networks:
      - diavgeia-net

  loki:
    image: grafana/loki:latest
    container_name: diavgeia_loki
    ports:
      - "3100:3100"
    networks:
      - diavgeia-net
    volumes:
      - loki_data:/loki
      - ./loki-config:/etc/loki
    command: -config.file=/etc/loki/local-config.yaml
    user: "0:0"  # run as root — volume is owned by root, otherwise mkdir fails
    healthcheck:
      # grafana/loki:latest is distroless (no shell, no wget).
      # Use Loki's own binary as a liveness probe — if we can exec it, the container is alive.
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3

  promtail:
    image: grafana/promtail:latest
    container_name: diavgeia_promtail
    volumes:
      - ./promtail-config/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - diavgeia-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: diavgeia_grafana
    ports:
      - "3001:3000"  # Expose on 3001 to avoid conflict with React dev server
    networks:
      - diavgeia-net
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
  db:
    image: pgvector/pgvector:pg17
    container_name: diavgeia_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init-scripts:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    env_file:
      - ../.env_files/.env.local.secrets
    networks:
      - diavgeia-net
    ports:
      - "3871:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 5s
      retries: 5

  # ───────────────────────── Broker ──────────────────────────
  rabbitmq:
    # image: rabbitmq:4.01-management
    image: rabbitmq:3.12-management
    container_name: diavgeia_rabbitmq
    ports:
      - "5672:5672"  # AMQP protocol
      - "15672:15672"  # Management interface
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    networks:
      - diavgeia-net
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5

  # ──────────────────────── Cache ─────────────────────────
  redis:
    image: redis:8.0.0-alpine
    container_name: diavgeia_redis
    # Unblock to enable custom config (e.g. for persistence, maxmemory, etc.)
    # command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - diavgeia-net
    volumes:
      - redis_data:/data
      # Also unblock to enable custom config (e.g. for persistence, maxmemory, etc.)
      # - ./redis-config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5

  # Add to docker-compose.yml
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: diavgeia_redis_commander
    environment:
      # Configure Redis Commander to show all 3 databases:
      # DB 0: Celery task results
      # DB 1: Django cache + Search history
      # DB 2: Import decision chunks
      - REDIS_HOSTS=celery:redis:6379:0:${REDIS_PASSWORD},cache:redis:6379:1:${REDIS_PASSWORD},import:redis:6379:2:${REDIS_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - diavgeia-net
    depends_on:
      - redis

  # ───────────────────────── Backend ─────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: diavgeia_backend
    volumes:
      - ../backend:/code
    ports:
      - "8000:8000"
      - "${DJANGO_DEBUG_PORT:-8002}:${DJANGO_DEBUG_PORT:-8002}"
      - "8003:8003"
    env_file:
      - ../.env_files/.env.local.secrets
    environment:
      - DJANGO_DEBUG_PORT=${DJANGO_DEBUG_PORT:-8002}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - JAEGER_HOST=${JAEGER_HOST:-jaeger}
      - JAEGER_PORT=${JAEGER_PORT:-4317}
      - OPENSEARCH_URL=${OPENSEARCH_URL:-http://opensearch:9200}
      - GEMI_API_KEY=${GEMI_API_KEY}
      - STEALTH_MODE=${STEALTH_MODE:-false}
      - STEALTH_ALLOWLIST=${STEALTH_ALLOWLIST:-false}
      # Logging controls
      # - USE_JSON_LOGGING=${USE_JSON_LOGGING:-false}
      - DJANGO_LOG_LEVEL=${BACKEND_LOG_LEVEL:-INFO}
      - DB_LOG_LEVEL=${DB_LOG_LEVEL:-WARNING}
    networks:
      - diavgeia-net
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
      args:
        # Control worker mode via environment variable
        # LIGHT_WORKER=true  → lightweight (no Docling, ~500MB, 2-3 min build)
        # LIGHT_WORKER=false → full mode (with Docling, ~13GB, 15+ min build)
        LIGHT_WORKER: ${LIGHT_WORKER:-false}
    container_name: diavgeia_worker
    command: ["/code/worker_entrypoint.sh"]
    restart: unless-stopped
    networks:
      - diavgeia-net
    volumes:
      - ../backend:/code
    ports:
      - "${CELERY_DEBUG_PORT:-8004}:${CELERY_DEBUG_PORT:-8004}"
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - ../.env_files/.env.local.secrets
    environment:
      - CELERY_DEBUG_PORT=${CELERY_DEBUG_PORT:-8004}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - JAEGER_HOST=${JAEGER_HOST:-jaeger}
      - JAEGER_PORT=${JAEGER_PORT:-4317}
      - LIGHT_WORKER=${LIGHT_WORKER:-false}
      # Logging controls - single knob for worker
      - USE_JSON_LOGGING=true
      - DJANGO_LOG_LEVEL=${WORKER_LOG_LEVEL:-INFO}
      - CELERY_LOG_LEVEL=${WORKER_LOG_LEVEL:-INFO}
      - DB_LOG_LEVEL=${DB_LOG_LEVEL:-WARNING}

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery-light
    container_name: diavgeia_beat
    command: celery -A diavgeia_project beat -l INFO
    networks:
      - diavgeia-net
    volumes:
      - ../backend:/code
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - ../.env_files/.env.local.secrets
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//

  flower:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery-light
    container_name: diavgeia_flower
    command: celery -A diavgeia_project flower --port=5555  --basic-auth=${FLOWER_BASIC_AUTH}
    networks:
      - diavgeia-net
    ports:
      - "5555:5555"
    volumes:
      - ../backend:/code
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - ../.env_files/.env.local.secrets
    environment:
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH}

  # ───────────────────────── Front end ───────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_CLERK_PUBLISHABLE_KEY=${REACT_APP_CLERK_PUBLISHABLE_KEY}
      - REACT_APP_API_URL=${REACT_APP_API_URL:-/api}
    networks:
      - diavgeia-net

  # ──────────────────────── Gateway ──────────────────────────
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    volumes:
      - ../nginx/local.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"                        # ← the single public port
    depends_on: [backend, frontend, flower, jaeger]
    environment:
    - HOST=0.0.0.0
    networks:
      - diavgeia-net

  # Step 1a: Add OpenSearch
  opensearch:
    build:
      context: ./opensearch-custom
      dockerfile: Dockerfile
    container_name: diavgeia_opensearch
    environment:
      - "discovery.type=single-node"
      - "plugins.security.disabled=true"
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_S3_REGION_NAME:-eu-north-1}
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - diavgeia-net
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      - ./opensearch-config:/usr/share/opensearch/config/custom
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  opensearch_dashboards:
    image: opensearchproject/opensearch-dashboards:3
    container_name: diavgeia_opensearch_dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    expose:
      - "5601"
    networks:
      - diavgeia-net
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch_data:
    driver: local
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local

networks:
  diavgeia-net:
    driver: bridge
