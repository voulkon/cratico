apiVersion: 1

# The explicit `uid: loki` below replaced a previously auto-generated UID.
# Provisioning cannot change a UID in place, so delete the old row first and
# recreate it deterministically on every startup.
deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  # Jaeger is provisioned FIRST and has no datasourceUid references: Grafana
  # validates those references during provisioning, so it must exist before
  # Loki's derived field points at it.
  - name: Jaeger
    type: jaeger
    access: proxy
    orgId: 1
    uid: jaeger
    url: http://jaeger:16686
    basicAuth: false
    isDefault: false
    version: 1
    editable: false

  # Loki for logs.  Its derived field links log trace IDs to Jaeger.
  #
  # NOTE: Jaeger's tracesToLogsV2 (Jaeger -> Loki direction) was removed
  # because it created a circular provisioning dependency: Loki referenced
  # Jaeger while Jaeger referenced Loki, and Grafana 13 fails provisioning
  # with "data source not found" when the target does not exist yet.
  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    uid: loki
    url: http://loki:3100
    basicAuth: false
    isDefault: true
    version: 1
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        # Extract trace IDs from logs to link to Jaeger
        - datasourceUid: jaeger
          matcherRegex: "trace_id[=:]([a-fA-F0-9]+)"
          name: TraceID
          url: "$${__value.raw}"
