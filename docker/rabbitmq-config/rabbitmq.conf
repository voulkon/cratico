# RabbitMQ broker configuration.

# A delivery acknowledgement must arrive within this window, otherwise the
# broker closes the channel (PRECONDITION_FAILED 406).  Celery treats that as
# unrecoverable and stops consuming while the process stays Up.
#
# Invariant: longest possible task wall time < consumer_timeout.
# Parent tasks that run extraction inline are limited to 25 min, so 30 min
# keeps the 406 unreachable.  Raise this only together with the task limits.
consumer_timeout = 1800000

# Per-object (per-queue) metrics are required for the queue-specific alerts
# (`rabbitmq_queue_consumers{queue="celery"}` etc.).  The aggregated default
# drops the `queue` label.  This deployment has very few queues, so the cost
# is negligible.
prometheus.return_per_object_metrics = true
